<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero PMO - Vardí</title>
  
  <link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_iqgt0riqgt0riqgt.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado con Logo -->
  <div class="header-logo">
    <img src="Gemini_Generated_Image_iqgt0riqgt0riqgt.jpg" alt="Vardí PMO Posventa">
  </div>

  <!-- Controles para crear tareas y seleccionar proyectos -->
  <div class="form-container">
    
    <select id="projectSelect" onchange="verificarNuevoProyecto()">
      <option value="">-- Seleccionar Proyecto --</option>
      <option value="NUEVO">+ Crear Nuevo Proyecto...</option>
    </select>
    
    <input type="text" id="newProjectInput" placeholder="Escribe el nuevo proyecto..." style="display:none;">
    
    <input type="text" id="taskInput" placeholder="Nombre de la tarea (Opcional si solo creas proyecto)...">
    
    <select id="prioritySelect">
      <option value="alta">Alta</option>
      <option value="media">Media</option>
      <option value="baja">Baja</option>
      <option value="detenido">⚪ Detenido</option>
    </select>
    
    <button onclick="agregarAlTablero()">Guardar</button>
  </div>

  <!-- Controles para FILTRAR la vista -->
  <div class="form-container" style="margin-top: -10px; border-bottom: 2px solid #ddd; padding-bottom: 20px;">
    <label for="filterProject" style="font-weight: bold; margin-top: 8px;">Filtrar Proyecto:</label>
    <select id="filterProject" onchange="aplicarFiltro()">
      <option value="todos">Todos los proyectos</option>
    </select>

    <label for="filterPriority" style="font-weight: bold; margin-top: 8px; margin-left: 15px;">Prioridad:</label>
    <select id="filterPriority" onchange="aplicarFiltro()">
      <option value="todas">Todas</option>
      <option value="alta">🔴 Alta</option>
      <option value="media">🟡 Media</option>
      <option value="baja">🟢 Baja</option>
      <option value="detenido">⚪ Detenido</option>
    </select>
  </div>

  <!-- Tablero Kanban -->
  <div class="kanban-board">
    <div class="column" id="backlog" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>Backlog / Por Iniciar</h2>
      <div class="cards-container"></div>
    </div>

    <div class="column" id="planeacion" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>Planeación</h2>
      <div class="cards-container"></div>
    </div>

    <div class="column" id="ejecucion" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>En Ejecución</h2>
      <div class="cards-container"></div>
    </div>

    <div class="column" id="validacion" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>Validación / Pruebas</h2>
      <div class="cards-container"></div>
    </div>

    <div class="column" id="cierre" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>Cierre / Finalizado</h2>
      <div class="cards-container"></div>
    </div>
  </div>

  <!-- Ventana Emergente (Modal) para Editar Tareas -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarModal()">&times;</span>
      <h3>Editar Tarea</h3>
      
      <input type="hidden" id="editTaskId">
      
      <div class="modal-field">
        <label>Título de la Tarea:</label>
        <input type="text" id="editTaskTitle" style="width: 90%;">
      </div>
      
      <div class="modal-field">
        <label>Proyecto:</label>
        <select id="editTaskProject" style="width: 95%;"></select>
      </div>

      <div class="modal-field">
        <label>Estado / Prioridad:</label>
        <select id="editTaskPriority" style="width: 95%;">
          <option value="alta">🔴 Alta</option>
          <option value="media">🟡 Media</option>
          <option value="baja">🟢 Baja</option>
          <option value="detenido">⚪ Detenido</option>
        </select>
      </div>

      <div class="modal-field">
        <label>Posición (Número de Orden):</label>
        <p style="font-size: 11px; color: #666; margin: 0 0 5px 0;">(Usa 1 para ponerla de primeras, 2 de segundas, etc. en la columna)</p>
        <input type="number" id="editTaskOrder" style="width: 90%;">
      </div>

      <button class="btn-guardar" onclick="guardarEdicion()">Guardar Cambios</button>
    </div>
  </div>

  <!-- SDKs de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
