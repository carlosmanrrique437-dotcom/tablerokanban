<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Proyectos</title>
  
  <link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_iqgt0riqgt0riqgt.jpg?v=3">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Tablero de Proyectos</h1>

  <!-- Controles para crear tareas, proyectos y fases (Fondo Azul Corporativo) -->
  <div class="form-container top-bar">
    
    <!-- Bloque Proyecto -->
    <select id="projectSelect" onchange="actualizarFases('crear')">
      <option value="">-- Proyecto (General) --</option>
      <option value="NUEVO">+ Crear Nuevo Proyecto...</option>
    </select>
    <input type="text" id="newProjectInput" placeholder="Nombre del proyecto..." style="display:none;" oninput="actualizarFases('crear')">
    
    <!-- Bloque Fase -->
    <select id="phaseSelect" onchange="actualizarBoton()">
      <option value="">-- Sin Fase --</option>
    </select>
    <input type="text" id="newPhaseInput" placeholder="Nombre de la fase..." style="display:none;" oninput="actualizarBoton()">
    
    <!-- Bloque Tarea -->
    <input type="text" id="taskInput" placeholder="Nombre de la tarea..." oninput="actualizarBoton()">
    <select id="prioritySelect">
      <option value="alta">Alta</option>
      <option value="media">Media</option>
      <option value="baja">Baja</option>
      <option value="detenido">⚪ Detenido</option>
    </select>
    
    <button id="btnPrincipal" onclick="agregarAlTablero()">Agregar Tarea</button>
  </div>

  <!-- Controles para FILTRAR la vista -->
  <div class="form-container" style="border-bottom: 2px solid #ddd; padding-bottom: 15px;">
    
    <label for="filterProject" style="font-weight: bold; margin-top: 8px;">Proyecto:</label>
    <select id="filterProject" onchange="actualizarFiltroFases()">
      <option value="todos">Todos</option>
    </select>
    <button id="btnEliminarProyecto" onclick="eliminarProyectoSeleccionado()" style="display: none; background-color: #dc3545; color: white; padding: 6px 10px; margin-left: 2px;">🗑️</button>

    <label for="filterPhase" style="font-weight: bold; margin-top: 8px; margin-left: 10px;">Fase:</label>
    <select id="filterPhase" onchange="aplicarFiltro()">
      <option value="todas">Todas</option>
    </select>

    <label for="filterPriority" style="font-weight: bold; margin-top: 8px; margin-left: 10px;">Prioridad:</label>
    <select id="filterPriority" onchange="aplicarFiltro()">
      <option value="todas">Todas</option>
      <option value="alta">🔴 Alta</option>
      <option value="media">🟡 Media</option>
      <option value="baja">🟢 Baja</option>
      <option value="detenido">⚪ Detenido</option>
    </select>
  </div>

  <!-- BARRA DE SCROLL SUPERIOR -->
  <div id="topScrollWrapper" onscroll="syncScroll('top')">
    <div id="topScrollContent"></div>
  </div>

  <!-- Tablero Kanban -->
  <div class="kanban-board" id="kanbanBoard" onscroll="syncScroll('bottom')">
    <div class="column" id="backlog" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>Backlog / Por Iniciar</h2>
      <div class="cards-container"></div>
    </div>

    <div class="column" id="planeacion" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>Planeación</h2>
      <div class="cards-container"></div>
    </div>

    <div class="column" id="ejecucion" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>En Ejecución</h2>
      <div class="cards-container"></div>
    </div>

    <div class="column" id="validacion" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>Validación / Pruebas</h2>
      <div class="cards-container"></div>
    </div>

    <div class="column" id="cierre" ondrop="drop(event)" ondragover="allowDrop(event)">
      <h2>Cierre / Finalizado</h2>
      <div class="cards-container"></div>
    </div>
  </div>

  <!-- Ventana Emergente (Modal) para Editar Tareas -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarModal()">&times;</span>
      <h3 style="color: #22407A;">Editar Tarea</h3>
      <input type="hidden" id="editTaskId">
      
      <div class="modal-field">
        <label>Título de la Tarea:</label>
        <input type="text" id="editTaskTitle" style="width: 90%;">
      </div>
      
      <div class="modal-field">
        <label>Proyecto:</label>
        <select id="editTaskProject" style="width: 95%;" onchange="actualizarFases('editar')"></select>
      </div>

      <div class="modal-field">
        <label>Fase:</label>
        <select id="editTaskPhase" style="width: 95%;" onchange="verificarNuevaFaseEdicion()"></select>
        <input type="text" id="newEditPhaseInput" placeholder="Nueva fase..." style="display:none; width: 90%; margin-top: 5px;">
      </div>

      <div class="modal-field">
        <label>Estado / Prioridad:</label>
        <select id="editTaskPriority" style="width: 95%;">
          <option value="alta">🔴 Alta</option>
          <option value="media">🟡 Media</option>
          <option value="baja">🟢 Baja</option>
          <option value="detenido">⚪ Detenido</option>
        </select>
      </div>

      <div class="modal-field">
        <label>Responsable:</label>
        <input type="text" id="editTaskResponsable" style="width: 90%;" placeholder="Ej. CARLOS IVAN">
      </div>

      <div class="modal-field">
        <label>Posición (Número de Orden):</label>
        <input type="number" id="editTaskOrder" style="width: 90%;">
      </div>

      <button class="btn-guardar" onclick="guardarEdicion()">Guardar Cambios</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
